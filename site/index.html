<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ECEBE8">
<meta name="robots" content="noindex">
<title>Ficha de ideia · Russo</title>
<meta property="og:title" content="Ficha de ideia · Russo">
<meta property="og:description" content="Me conta sua ideia. Leva uns 3 minutos e eu leio uma por uma.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ECEBE8'/%3E%3Cpath d='M20 46V18h14a9 9 0 0 1 0 18H28l12 10' fill='none' stroke='%23C8321E' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Karla:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
/* Direção "papel de decalque", paleta grafite e vermelho.
   Papel pautado claro, traço grafite pontilhado, vermelho só pro que o cliente escolheu. */
:root{
  --paper:#ECEBE8;      /* papel */
  --sheet:#F6F5F2;      /* campos e opções */
  --ink:#2B2A28;        /* grafite */
  --ink-2:#5F5C57;
  --ink-3:#8E8A83;
  --dash:#9C988F;       /* traço pontilhado em repouso */
  --rule:rgba(43,42,40,.065);
  --red:#C8321E;        /* escolhido */
  --red-soft:rgba(200,50,30,.07);
  --f-type:"Courier Prime","Courier New",ui-monospace,monospace;
  --f-body:"Karla",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{
  font-family:var(--f-body);font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-wrap:break-word;
}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.screen{
  display:flex;flex-direction:column;min-height:100dvh;max-width:520px;margin:0 auto;
  background-image:repeating-linear-gradient(0deg,transparent 0 27px,var(--rule) 27px 28px);
}
.bar{padding:calc(16px + env(safe-area-inset-top)) 16px 0;flex:0 0 auto}
.pwrap{display:flex;align-items:center;gap:12px;border-bottom:1.5px dashed var(--ink);padding-bottom:10px}
.ptrack{flex:1;height:3px;background:#D6D3CC;overflow:hidden}
.pfill{height:100%;width:0;background:var(--red);transition:width .35s cubic-bezier(.4,0,.2,1)}
.pnum{font-family:var(--f-type);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.body{flex:1 1 auto;padding:24px 16px 14px;display:flex;flex-direction:column}
.eyebrow{font-family:var(--f-type);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--red);margin-bottom:10px}
.qtitle{font-family:var(--f-type);font-weight:700;font-size:clamp(27px,7.6vw,32px);line-height:1.08;letter-spacing:-.01em;margin:0 0 10px;text-wrap:balance}
.qmicro{color:var(--ink-2);font-size:15px;line-height:1.5;margin:0 0 20px}
.lines p{margin:0 0 12px;color:var(--ink-2);font-size:16px}
.foot{flex:0 0 auto;position:sticky;bottom:0;background:var(--paper);padding:12px 16px calc(14px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;border-top:1.5px dashed var(--ink)}
.back{border:1.5px dashed var(--dash);background:transparent;color:var(--ink-2);border-radius:4px;cursor:pointer;font-family:var(--f-type);font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:14px 14px}
.next{flex:1;border:0;background:var(--ink);color:var(--paper);border-radius:4px;cursor:pointer;font-family:var(--f-type);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;padding:15px 18px;text-align:center;text-decoration:none;display:block}
.next:active{transform:translateY(1px)}
.next:disabled{opacity:.45;cursor:wait}
.err{color:var(--red);font-size:14px;margin:0 0 12px;font-family:var(--f-type)}

.field{width:100%;background:var(--sheet);border:1.5px solid #C9C5BD;border-radius:4px;color:var(--ink);font-family:var(--f-body);font-size:17px;padding:14px 14px}
.field::placeholder{color:var(--ink-3)}
.field:focus{border-color:var(--ink);outline:none;box-shadow:0 0 0 3px var(--red-soft)}
textarea.field{min-height:150px;resize:vertical;line-height:1.55}
.count{font-family:var(--f-type);font-size:11px;color:var(--ink-3);text-align:right;margin-top:7px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;background:var(--sheet);border:1.5px dashed var(--dash);border-radius:4px;padding:14px 14px;color:var(--ink);font-size:16px;line-height:1.35;transition:border-color .12s,background-color .12s}
.opt .dot{flex:0 0 auto;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--dash);display:grid;place-items:center;font-size:11px;color:transparent}
.opt.sq .dot{border-radius:3px}
.opt[aria-pressed="true"]{border-style:solid;border-color:var(--red);background:var(--red-soft)}
.opt[aria-pressed="true"] .dot{background:var(--red);border-color:var(--red);color:#fff}
.drop{display:block;border:1.5px dashed var(--ink);border-radius:4px;background:var(--sheet);padding:24px 18px;text-align:center;cursor:pointer}
.drop b{display:block;font-family:var(--f-type);font-size:16px;margin-bottom:5px}
.drop span{color:var(--ink-2);font-size:14px;line-height:1.45;display:block}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.thumbs img{width:66px;height:66px;object-fit:cover;border-radius:3px;border:1.5px solid var(--ink)}
.said{background:var(--sheet);border:1.5px dashed var(--dash);border-radius:4px;padding:16px 16px;margin-bottom:14px}
.said p{margin:0 0 10px;font-size:16px;line-height:1.55}
.said p:last-child{margin-bottom:0}
.said .lead{font-family:var(--f-type);font-weight:700;font-size:21px;line-height:1.15;margin-bottom:12px}
.bullets{list-style:none;padding:0;margin:0 0 14px}
.bullets li{position:relative;padding-left:20px;margin-bottom:10px;font-size:16px;line-height:1.5}
.bullets li::before{content:"×";position:absolute;left:2px;top:-1px;color:var(--red);font-family:var(--f-type);font-weight:700}
.wa{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:transparent;border:1.5px solid var(--ink);color:var(--ink);border-radius:4px;padding:14px 15px;font-family:var(--f-type);font-weight:700;letter-spacing:.04em;text-decoration:none;font-size:15px}
.wa.done{border-color:var(--red);color:var(--red);background:var(--red-soft)}
.spin{width:38px;height:38px;border-radius:50%;border:3px solid #D6D3CC;border-top-color:var(--red);animation:spin .9s linear infinite;margin:40px auto 18px}
@keyframes spin{to{transform:rotate(360deg)}}
.center{text-align:center;color:var(--ink-2);font-family:var(--f-type)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
</style>
</head>
<body>
<div class="screen">
  <div class="bar"><div class="pwrap"><div class="ptrack"><div class="pfill" id="pfill"></div></div><div class="pnum" id="pnum">início</div></div></div>
  <main class="body" id="body"></main>
  <div class="foot" id="foot"></div>
</div>
<div class="hp" aria-hidden="true"><label>Site <input id="hp" tabindex="-1" autocomplete="off"></label></div>

<script>
/* ============ configuração (preencher antes de ir pro cliente) ============ */
var CONFIG = {
  PRAZO_RESPOSTA: "{{PRAZO_RESPOSTA}}",   // ex.: "48h"
  SINAL_PCT: "{{SINAL_PCT}}",             // ex.: "30"
  WHATSAPP_VIDEO: "5527999994248",        // só dígitos com 55 + DDD. Vazio = esconde a tela de vídeo
  INSTAGRAM: "https://instagram.com/russo.tattooer",
  ENDPOINT: "/api/ficha"
};

/* ============ perguntas (mesmas do protótipo) ============ */
var LOCAIS = ["Antebraço (interno)","Antebraço (externo)","Braço","Ombro","Peito","Costas (parte)","Costas (fechamento)","Costela","Barriga","Coxa","Panturrilha","Pé","Mão","Pescoço","Rosto","Outro"];
var EXPOSTO = ["Mão","Pescoço","Rosto"];

var GROUPS = {"nome": "Quem é você", "insta": "Quem é você", "whats": "Quem é você", "cidade": "Quem é você", "cidadeOutra": "Quem é você", "exp": "Quem é você", "ideia": "A ideia", "refs": "A ideia", "local": "Onde e como", "fotoLocal": "Onde e como", "tam": "Onde e como", "cover": "Onde e como", "coverFoto": "Onde e como", "coverIdade": "Onde e como", "cor": "Onde e como", "faixa": "Valor e agenda", "prazo": "Valor e agenda", "data": "Valor e agenda", "disp": "Valor e agenda", "origem": "Pra fechar", "quem": "Pra fechar", "ok": "Pra fechar"};

var STEPS = [
  { id:"intro", kind:"intro", title:"Ficha de ideia",
    lines:["Aqui é onde tudo começa. Leva uns 3 minutos.",
           "Quanto melhor você preencher, mais rápido eu te respondo, e menos ida e volta a gente tem.",
           "Não é robô. Sou eu que leio, uma por uma."],
    cta:"Bora" },

  { id:"nome", q:true, kind:"text", label:"Como te chamo?", title:"Como te chamo?", ph:"Seu nome", req:true },

  { id:"insta", q:true, kind:"text", label:"Seu @ do Instagram", title:"Seu @ do Instagram", ph:"@seuperfil", req:true,
    micro:"Sem o @ eu não consigo te achar depois. Se seu perfil é fechado, me segue que eu aceito." },

  { id:"whats", q:true, kind:"tel", label:"WhatsApp", title:"Seu WhatsApp", ph:"(00) 00000-0000", req:true,
    micro:"Com DDD. É por aqui que eu confirmo data e mando o desenho." },

  { id:"cidade", q:true, kind:"choice", label:"De onde você vem?", title:"De onde você vem?", req:true,
    opts:["Vitória","Vila Velha","Serra","Cariacica","Viana","Guarapari","Fundão","Fora da Grande Vitória"] },

  { id:"cidadeOutra", q:true, kind:"text", label:"Qual cidade?", title:"Qual cidade?", req:true,
    when:function(a){ return a.cidade === "Fora da Grande Vitória"; },
    ph:"Linhares, ES · Belo Horizonte, MG" },

  { id:"exp", q:true, kind:"choice", label:"É sua primeira tatuagem?", title:"É sua primeira tatuagem?", req:true,
    opts:["É a primeira","Tenho uma ou duas","Sou bem tatuado(a)","Você já me tatuou"] },

  { id:"acolhe", kind:"said", when:function(a){ return a.exp === "É a primeira"; },
    lead:"Primeira, então. Massa.",
    intro:"Só pra você ficar tranquilo antes de continuar:",
    bullets:["Dói, mas é suportável, e a gente para quantas vezes você precisar.",
             "Não existe pergunta boba. Pergunta tudo.",
             "Eu não te empurro desenho. Se sua ideia não ficar boa na pele, eu te falo antes, não depois."],
    cta:"Continuar" },

  { id:"ideia", q:true, kind:"textarea", label:"Me conta a ideia", title:"Me conta a ideia", req:true,
    ph:"Uma cobra enrolada num punhal, meio old school mas com sombra pesada...",
    micro:"Escreve como se estivesse me contando num boteco. Se tem significado, fala. Se é só porque você achou foda, fala também. As duas respostas são válidas." },

  { id:"refs", q:true, kind:"file", label:"Referências", title:"Manda referências", multiple:true,
    micro:"Print de anime, frame de episódio, página de mangá, foto, tattoo de outro artista, desenho torto no guardanapo. Não precisa ser bonito, precisa ser o que você tem na cabeça.",
    extra:{ id:"refLink", ph:"Link de pasta ou Pinterest (opcional)" } },

  { id:"local", q:true, kind:"choice", label:"Onde no corpo?", title:"Onde no corpo?", req:true, opts:LOCAIS, scroll:true },

  { id:"exposto", kind:"said", when:function(a){ return EXPOSTO.indexOf(a.local) >= 0; },
    lead:"Mão e dedo eu faço muito.",
    intro:"É uma das coisas que eu mais gosto. Mas tem regra e eu prefiro te falar agora:",
    bullets:["Essas regiões rejeitam mais tinta que o resto do corpo. Retoque ali já entra no combinado desde o começo.",
             "Se você nunca tatuou, eu vou te perguntar duas vezes se tem certeza. Não é pra te desanimar, é pra você não se arrepender.",
             "Rosto eu só fecho pessoalmente, olho no olho."],
    cta:"Entendi, continuar" },

  { id:"fotoLocal", q:true, kind:"file", label:"Foto do local", title:"Manda uma foto do local", req:true, multiple:false,
    micro:"Boa luz, sem filtro, com um cartão ou uma nota de R$ 10 do lado pra dar escala. É o que me deixa te dar o valor certo já na primeira resposta." },

  { id:"video", kind:"video", when:function(){ return !!CONFIG.WHATSAPP_VIDEO; },
    lead:"Vídeo também vale.",
    intro:"Se o local tem curva, cicatriz ou tattoo do lado, um vídeo de 10 segundos girando em volta mostra o que a foto não mostra.",
    bullets:["Manda no meu WhatsApp, que por lá vídeo vai fácil.","Não é obrigatório. Se a foto já mostra bem, segue."],
    cta:"Continuar" },

  { id:"freehand", kind:"said",
    lead:"Como eu desenho.",
    intro:"Boa parte dos meus trampos eu faço no freehand: desenho direto na sua pele, na hora.",
    bullets:["Você não vai receber um desenho pronto por WhatsApp dias antes. O desenho nasce no seu corpo, encaixado no seu músculo e no seu movimento.",
             "Antes de começar a agulha a gente olha junto e ajusta o que precisar. Você nunca vai ser tatuado em dúvida.",
             "Se você precisa aprovar um desenho antes pra ficar tranquilo, me fala que a gente resolve isso antes de fechar qualquer coisa."],
    cta:"Entendi, continuar" },

  { id:"tam", q:true, kind:"choice", label:"Tamanho aproximado", title:"Que tamanho, mais ou menos?", req:true,
    opts:["Até 5 cm","5 a 10 cm","10 a 15 cm","15 a 25 cm","Mais de 25 cm","Fechamento (braço · perna · costas)","Não sei · me ajuda"] },

  { id:"cover", q:true, kind:"choice", label:"É cobertura de uma tattoo antiga?", title:"É cobertura de uma tattoo antiga?", req:true,
    opts:["Não","Sim"] },

  { id:"coverFoto", q:true, kind:"file", label:"Foto da tattoo que vai ser coberta", title:"Foto da tattoo atual", req:true, multiple:true,
    when:function(a){ return a.cover === "Sim"; },
    micro:"Precisa de luz boa. É pelo tanto de preto que já tem ali que eu sei o que dá pra fazer." },

  { id:"coverIdade", q:true, kind:"choice", label:"Há quanto tempo ela foi feita?", title:"Há quanto tempo ela foi feita?", req:true,
    when:function(a){ return a.cover === "Sim"; },
    opts:["Menos de 1 ano","1 a 5 anos","Mais de 5 anos","Já tentei clarear a laser"] },

  { id:"cor", q:true, kind:"choice", label:"Preto e cinza ou colorido?", title:"Preto e cinza ou colorido?", req:true,
    opts:["Preto e cinza","Colorido","Confio em você"] },

  { id:"corAviso", kind:"said", when:function(a){ return a.cor === "Colorido"; },
    lead:"Sobre cor, pra já alinhar.",
    intro:"Quase tudo que eu faço é preto e cinza. Cor eu faço pontual, dentro de peça preta.",
    bullets:["Se sua ideia depende de cor cheia, eu vou ser sincero e te indicar alguém melhor pra isso.",
             "Mas segue preenchendo mesmo assim que eu te falo o que dá."],
    cta:"Beleza, continuar" },

  { id:"faixa", q:true, kind:"choice", label:"Quanto você tem pra investir nesse projeto?", title:"Quanto você tem pra investir?", req:true,
    micro:"Não é pra eu te cobrar esse valor. É pra eu te propor algo que caiba. Tattoo boa não é a mais barata. É a que você não vai querer cobrir daqui a cinco anos.",
    opts:["Até R$ 500","R$ 500 a 1.000","R$ 1.000 a 2.000","R$ 2.000 a 4.000","Acima de R$ 4.000","Prefiro que você me diga"] },

  { id:"prazo", q:true, kind:"choice", label:"Quando você quer fazer?", title:"Quando você quer fazer?", req:true,
    opts:["Sem pressa · quero fazer bem feito","Nos próximos 30 dias","Tenho data marcada"] },

  { id:"data", q:true, kind:"date", label:"Qual a data?", title:"Qual a data?", req:true,
    when:function(a){ return a.prazo === "Tenho data marcada"; },
    micro:"Tattoo precisa de tempo pra cicatrizar antes do evento. Melhor eu saber agora." },

  { id:"disp", q:true, kind:"multi", label:"Quando você consegue vir?", title:"Quando você consegue vir?", req:true,
    micro:"Pode marcar mais de uma.",
    opts:["Manhã de semana","Tarde de semana","Sábado","Dia inteiro, sem pressa","Sou flexível"] },

  { id:"origem", q:true, kind:"choice", label:"Como você chegou até mim?", title:"Como você chegou até mim?", req:true,
    opts:["Instagram","Indicação","Convenção / evento","Passei no estúdio","Outro"] },

  { id:"quem", q:true, kind:"text", label:"Quem te indicou?", title:"Quem te indicou?", ph:"Nome ou @", req:true,
    when:function(a){ return a.origem === "Indicação"; },
    micro:"Gosto de agradecer quem manda gente boa pra cá." },

  { id:"ok", q:true, kind:"checks", label:"Combinado?", title:"Combinado?", req:true,
    micro:"Marca tudo pra gente começar certo.",
    opts:["Tenho 18 anos ou mais e levo documento com foto",
          "Sei que a data só trava com o sinal de " + CONFIG.SINAL_PCT + "%, e que o sinal não volta se eu desmarcar em cima da hora",
          "Sei que o desenho é fechado com o Russo e pode não ficar idêntico à referência. Ele não copia trabalho de outro tatuador",
          "Sei que a resposta pode levar até " + CONFIG.PRAZO_RESPOSTA + " úteis"] },

  { id:"fim", kind:"said", final:true,
    lead:"Fechou. Tá na minha lista.",
    intro:"",
    paras:["Obrigado pela confiança de já sair mandando tudo. Isso me economiza um tempo que eu não tenho.",
           "Eu olho pessoalmente, uma por uma. Se for um trampo que eu faça bem, te chamo no WhatsApp em até " + CONFIG.PRAZO_RESPOSTA + " com valor, quantas sessões e as datas que eu tenho.",
           "Se não for meu estilo eu também te respondo, e te indico alguém que faça melhor que eu. Prefiro te mandar pro cara certo do que fazer meia-boca.",
           "Tamo junto."],
    cta:null },
];

/* ============ estado ============ */
var A = {};          // respostas
var F = {};          // arquivos: id -> [{file, url}]
var idx = 0;
var body = document.getElementById('body');
var foot = document.getElementById('foot');

function visible(){ return STEPS.filter(function(s){ return !s.when || s.when(A); }); }
function qList(){ return visible().filter(function(s){ return s.q; }); }
function el(tag, cls, txt){ var e = document.createElement(tag); if(cls) e.className = cls; if(txt != null) e.textContent = txt; return e; }

function progress(s){
  var qs = qList(), qi = s.q ? qs.indexOf(s) + 1 : 0;
  var pf = document.getElementById('pfill'), pn = document.getElementById('pnum');
  if(s.kind === 'intro'){ pf.style.width = '0%'; pn.textContent = 'início'; }
  else if(s.final){ pf.style.width = '100%'; pn.textContent = 'enviado'; }
  else if(qi){ pf.style.width = Math.round(qi / qs.length * 100) + '%'; pn.textContent = qi + ' de ' + qs.length; }
  else pn.textContent = 'recado';
}

function render(){
  var vis = visible();
  if(idx >= vis.length) idx = vis.length - 1;
  var s = vis[idx];
  body.innerHTML = ''; foot.innerHTML = '';
  progress(s);

  if(s.kind === 'intro'){
    body.appendChild(el('div','eyebrow','@russo.tattooer'));
    body.appendChild(el('h1','qtitle', s.title));
    var l = el('div','lines');
    s.lines.forEach(function(t){ l.appendChild(el('p', null, t)); });
    body.appendChild(l);
  } else if(s.kind === 'said' || s.kind === 'video'){
    var box = el('div','said');
    box.appendChild(el('div','lead', s.lead));
    if(s.intro) box.appendChild(el('p', null, s.intro));
    (s.paras || []).forEach(function(p){ box.appendChild(el('p', null, p)); });
    body.appendChild(box);
    if(s.bullets){ var ul = el('ul','bullets'); s.bullets.forEach(function(b){ ul.appendChild(el('li', null, b)); }); body.appendChild(ul); }
    if(s.kind === 'video') body.appendChild(videoButton());
    if(s.final){
      var ig = el('a','next','Voltar pro Instagram'); ig.href = CONFIG.INSTAGRAM; foot.appendChild(ig);
      return;
    }
  } else {
    body.appendChild(el('div','eyebrow', GROUPS[s.id] || 'Ficha de ideia'));
    body.appendChild(el('h1','qtitle', s.title));
    if(s.micro) body.appendChild(el('p','qmicro', s.micro));
    var e = el('p','err'); e.id = 'err'; e.hidden = true; body.appendChild(e);
    body.appendChild(control(s));
  }

  if(idx > 0){ var b = el('button','back','Voltar'); b.type = 'button'; b.onclick = function(){ idx--; render(); }; foot.appendChild(b); }
  var n = el('button','next', s.cta || (s.id === 'ok' ? 'Enviar ficha' : 'Continuar'));
  n.type = 'button'; n.onclick = advance; foot.appendChild(n);
  window.scrollTo(0, 0);
}

function videoButton(){
  var a = el('a','wa', A.video ? '✓ Abri o WhatsApp' : 'Mandar vídeo no WhatsApp');
  if(A.video) a.className += ' done';
  var nome = String(A.nome || '').split(' ')[0];
  a.href = 'https://wa.me/' + CONFIG.WHATSAPP_VIDEO + '?text=' + encodeURIComponent('Fala! Aqui é ' + (nome || 'quem acabou de preencher a ficha') + '. Segue o vídeo do local da tattoo.');
  a.target = '_blank'; a.rel = 'noopener';
  a.onclick = function(){ A.video = 'Vai mandar vídeo no WhatsApp'; setTimeout(render, 400); };
  return a;
}

function control(s){
  var wrap = el('div');
  if(s.kind === 'text' || s.kind === 'tel' || s.kind === 'date'){
    var i = document.createElement('input');
    i.className = 'field'; i.id = 'in-' + s.id;
    i.type = s.kind === 'date' ? 'date' : (s.kind === 'tel' ? 'tel' : 'text');
    if(s.kind === 'tel') i.autocomplete = 'tel';
    if(s.id === 'nome') i.autocomplete = 'given-name';
    if(s.ph) i.placeholder = s.ph;
    i.value = A[s.id] || '';
    i.oninput = function(){ A[s.id] = i.value; hideErr(); };
    i.onkeydown = function(e){ if(e.key === 'Enter') advance(); };
    wrap.appendChild(i);
    setTimeout(function(){ try{ i.focus({ preventScroll:true }); }catch(e){} }, 50);
    return wrap;
  }
  if(s.kind === 'textarea'){
    var t = document.createElement('textarea');
    t.className = 'field'; t.placeholder = s.ph || ''; t.value = A[s.id] || '';
    var c = el('div','count', t.value.length + ' caracteres');
    t.oninput = function(){ A[s.id] = t.value; c.textContent = t.value.length + ' caracteres' + (t.value.length > 120 ? '  ·  boa, isso ajuda muito' : ''); hideErr(); };
    wrap.appendChild(t); wrap.appendChild(c);
    return wrap;
  }
  if(s.kind === 'choice' || s.kind === 'multi' || s.kind === 'checks'){
    var box = el('div','opts');
    s.opts.forEach(function(o){
      var b = el('button', s.kind === 'choice' ? 'opt' : 'opt sq'); b.type = 'button';
      b.appendChild(el('span','dot','✓')); b.appendChild(el('span', null, o));
      var on = s.kind === 'choice' ? A[s.id] === o : (A[s.id] || []).indexOf(o) >= 0;
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
      b.onclick = function(){
        hideErr();
        if(s.kind === 'choice'){
          A[s.id] = o;
          Array.prototype.forEach.call(box.children, function(x){ x.setAttribute('aria-pressed','false'); });
          b.setAttribute('aria-pressed','true');
          setTimeout(advance, 170);
        } else {
          var cur = A[s.id] || [], at = cur.indexOf(o);
          if(at >= 0) cur.splice(at, 1); else cur.push(o);
          A[s.id] = cur; b.setAttribute('aria-pressed', at >= 0 ? 'false' : 'true');
        }
      };
      box.appendChild(b);
    });
    wrap.appendChild(box);
    return wrap;
  }
  if(s.kind === 'file'){
    var lab = document.createElement('label'); lab.className = 'drop';
    lab.appendChild(el('b', null, s.multiple ? 'Escolher imagens' : 'Escolher imagem'));
    lab.appendChild(el('span', null, s.multiple ? 'até 5 fotos · da galeria ou da câmera' : 'uma foto basta · da galeria ou da câmera'));
    var inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*'; if(s.multiple) inp.multiple = true;
    var th = el('div','thumbs');
    var draw = function(){ th.innerHTML = ''; (F[s.id] || []).forEach(function(x){ var im = document.createElement('img'); im.src = x.url; im.alt = ''; th.appendChild(im); }); };
    inp.onchange = function(){
      var list = Array.prototype.slice.call(inp.files).slice(0, s.multiple ? 5 : 1);
      F[s.id] = list.map(function(f){ return { file:f, url:URL.createObjectURL(f) }; });
      draw(); hideErr();
    };
    lab.appendChild(inp); wrap.appendChild(lab); wrap.appendChild(th); draw();
    if(s.extra){
      var ex = document.createElement('input');
      ex.className = 'field'; ex.type = 'url'; ex.placeholder = s.extra.ph; ex.style.marginTop = '12px';
      ex.value = A[s.extra.id] || ''; ex.oninput = function(){ A[s.extra.id] = ex.value; };
      wrap.appendChild(ex);
    }
    return wrap;
  }
  return wrap;
}

function hideErr(){ var e = document.getElementById('err'); if(e) e.hidden = true; }
function showErr(m){ var e = document.getElementById('err'); if(e){ e.textContent = m; e.hidden = false; } }

function valid(s){
  if(!s.req) return true;
  if(s.kind === 'file'){ if(!(F[s.id] && F[s.id].length)){ showErr('↑ Preciso dessa foto pra te responder direito.'); return false; } return true; }
  if(s.kind === 'multi'){ if(!(A[s.id] && A[s.id].length)){ showErr('↑ Marca pelo menos uma.'); return false; } return true; }
  if(s.kind === 'checks'){ if(!A[s.id] || A[s.id].length < s.opts.length){ showErr('↑ Precisa marcar todas.'); return false; } return true; }
  if(!A[s.id] || !String(A[s.id]).trim()){ showErr('↑ Essa aqui eu preciso.'); return false; }
  if(s.id === 'whats' && String(A.whats).replace(/\D/g,'').length < 10){ showErr('↑ Coloca com DDD, só números já serve.'); return false; }
  return true;
}

function advance(){
  var vis = visible(), s = vis[idx];
  if(s.q && !valid(s)) return;
  if(s.id === 'ok'){ enviar(); return; }
  var after = visible(), pos = after.indexOf(s);
  if(pos < 0) pos = idx;
  if(pos < after.length - 1){ idx = pos + 1; render(); }
}

/* ============ envio ============ */
function comprimir(file){
  return new Promise(function(resolve){
    if(!/^image\//.test(file.type) || !window.createImageBitmap){ resolve(file.size < 4e6 ? file : null); return; }
    createImageBitmap(file).then(function(bmp){
      var max = 1600, k = Math.min(1, max / Math.max(bmp.width, bmp.height));
      var c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      c.toBlob(function(b){
        if(!b){ resolve(file.size < 4e6 ? file : null); return; }
        resolve(new File([b], (file.name || 'foto').replace(/\.[^.]+$/, '') + '.jpg', { type:'image/jpeg' }));
      }, 'image/jpeg', 0.8);
    }).catch(function(){ resolve(file.size < 4e6 ? file : null); });
  });
}

function respostas(){
  var out = [];
  visible().forEach(function(s){
    if(!s.q || s.kind === 'file') return;
    var v = A[s.id];
    if(v == null || v === '' || (Array.isArray(v) && !v.length)) return;
    out.push({ label:s.label, value:v });
  });
  if(A.refLink) out.push({ label:'Link de pasta / Pinterest', value:A.refLink });
  if(A.video) out.push({ label:'Vídeo do local', value:A.video });
  return out;
}

function telaEnviando(){
  body.innerHTML = ''; foot.innerHTML = '';
  body.appendChild(el('div','spin'));
  body.appendChild(el('p','center','Mandando sua ficha e as fotos…'));
}

function telaErro(msg){
  body.innerHTML = ''; foot.innerHTML = '';
  var box = el('div','said');
  box.appendChild(el('div','lead','Não foi dessa vez.'));
  box.appendChild(el('p', null, msg || 'A ficha não chegou. Suas respostas continuam aqui, é só tentar de novo.'));
  box.appendChild(el('p', null, 'Se continuar dando erro, me chama no direct.'));
  body.appendChild(box);
  var b = el('button','next','Tentar de novo'); b.type = 'button'; b.onclick = enviar; foot.appendChild(b);
}

function enviar(){
  telaEnviando();
  var fd = new FormData();
  fd.append('respostas', JSON.stringify(respostas()));
  fd.append('site', document.getElementById('hp').value || '');
  var jobs = [];
  visible().forEach(function(s){
    if(s.kind !== 'file') return;
    (F[s.id] || []).forEach(function(x, i){
      jobs.push(comprimir(x.file).then(function(f){ if(f) fd.append('arquivo:' + s.label, f, s.id + '-' + (i + 1) + '.jpg'); }));
    });
  });
  Promise.all(jobs).then(function(){
    return fetch(CONFIG.ENDPOINT, { method:'POST', body:fd });
  }).then(function(r){
    if(!r.ok) return r.json().catch(function(){ return {}; }).then(function(j){ throw new Error(j.erro || ''); });
    var vis = visible(); idx = vis.length - 1; render();
  }).catch(function(e){ telaErro(e && e.message); });
}

render();
</script>
